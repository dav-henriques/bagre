<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>bagre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --fg: #141414;
    --dim: rgba(20, 20, 20, 0.5);
    --faint: rgba(20, 20, 20, 0.14);
    --line: rgba(0, 0, 0, 0.08);
    --sans: "Geist", ui-sans-serif, system-ui, sans-serif;
    --mono: "Geist Mono", ui-monospace, Menlo, Consolas, monospace;
  }


  * { box-sizing: border-box; }


  html, body {
    height: 100%;
    margin: 0;
  }


  body {
    background: var(--bg);
    color: var(--fg);
    font: 400 12px/1.4 var(--sans);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }


  .stage {
    position: relative;
    height: 100vh;
    height: 100svh;
    cursor: pointer;
  }


  .stage video {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: fill;
    pointer-events: none;
  }


  #scene {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
  }


  .panel {
    position: fixed;
    left: 24px;
    top: 24px;
    width: 264px;
    border-radius: 22px;
    background: rgba(255, 255, 255, 0.45);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    z-index: 10;
  }


  .panel-inner {
    position: relative;
    z-index: 3;
    pointer-events: auto;
  }


  .handle {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px 12px 18px;
    cursor: grab;
    user-select: none;
    touch-action: none;
  }


  .handle.grabbing { cursor: grabbing; }


  .grip {
    display: grid;
    grid-template-columns: repeat(3, 3px);
    gap: 3px;
  }


  .grip i {
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: var(--dim);
  }


  .title {
    flex: 1;
    font-weight: 500;
    font-size: 12px;
    letter-spacing: 0.01em;
    color: var(--dim);
  }


  .collapse {
    position: relative;
    width: 22px;
    height: 22px;
    border-radius: 50%;
  }


  .collapse span {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 9px;
    height: 1.5px;
    margin: -0.75px 0 0 -4.5px;
    border-radius: 1px;
    background: currentColor;
  }


  .collapse span + span { transform: rotate(90deg) scaleX(0); }


  .wrap { overflow: hidden; }


  .body {
    display: grid;
    gap: 14px;
    padding: 2px 18px 16px;
  }


  .row {
    display: grid;
    grid-template-columns: 12px 1fr 50px;
    align-items: center;
    gap: 12px;
  }


  .row label {
    font: 500 11px/1 var(--mono);
    text-transform: uppercase;
    color: var(--dim);
    transition: color .3s;
  }


  .row.on label { color: var(--fg); }


  .row output {
    text-align: right;
    font: 400 11px/1 var(--mono);
    font-variant-numeric: tabular-nums;
    color: var(--dim);
    transition: color .3s;
  }


  .row.on output { color: var(--fg); }


  .slider {
    position: relative;
    height: 20px;
  }


  .slider::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 1px;
    height: 7px;
    margin: -3.5px 0 0 -0.5px;
    background: var(--faint);
  }


  input[type=range] {
    --a: 50%;
    --b: 50%;
    position: relative;
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 20px;
    margin: 0;
    background: transparent;
    cursor: pointer;
  }


  input[type=range]::-webkit-slider-runnable-track {
    height: 2px;
    border-radius: 2px;
    background: linear-gradient(90deg,
      var(--faint) var(--a), var(--fg) var(--a),
      var(--fg) var(--b), var(--faint) var(--b));
  }


  input[type=range]::-moz-range-track {
    height: 2px;
    border-radius: 2px;
    background: linear-gradient(90deg,
      var(--faint) var(--a), var(--fg) var(--a),
      var(--fg) var(--b), var(--faint) var(--b));
  }


  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px;
    height: 12px;
    margin-top: -5px;
    border-radius: 50%;
    background: var(--fg);
    border: 0;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.18);
    transition: transform .25s cubic-bezier(.3, 1.6, .5, 1);
  }


  input[type=range]::-moz-range-thumb {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--fg);
    border: 0;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.18);
    transition: transform .25s cubic-bezier(.3, 1.6, .5, 1);
  }


  input[type=range]:hover::-webkit-slider-thumb { transform: scale(1.15); }
  input[type=range]:active::-webkit-slider-thumb { transform: scale(1.4); }
  input[type=range]:hover::-moz-range-thumb { transform: scale(1.15); }
  input[type=range]:active::-moz-range-thumb { transform: scale(1.4); }
  input[type=range]:focus { outline: none; }


  .foot {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    padding-top: 4px;
  }


  button {
    background: none;
    border: 0;
    padding: 0;
    font: inherit;
    color: var(--dim);
    cursor: pointer;
    transition: color .2s, background-color .2s;
  }


  button:hover, button:focus-visible { color: var(--fg); outline: none; }


  .btn {
    height: 32px;
    border-radius: 11px;
    background: rgba(0, 0, 0, 0.05);
    font-weight: 500;
    overflow: hidden;
  }


  .btn:hover { background: rgba(0, 0, 0, 0.09); }


  .btn span { display: inline-block; }
</style>
</head>
<body>
<canvas id="scene" data-liquid-ignore></canvas>
<main class="stage" id="stage">
  <video id="view" muted playsinline autoplay></video>
</main>


<div class="panel" id="panel">
  <div class="panel-inner" id="inner">
    <div class="handle" id="handle">
      <div class="grip" id="grip"><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div class="title">rotação</div>
      <button class="collapse" id="collapse" aria-label="recolher"><span></span><span></span></button>
    </div>
    <div class="wrap" id="wrap">
      <div class="body">
        <div class="row">
          <label for="rx">x</label>
          <div class="slider"><input type="range" id="rx" min="-360" max="360" step="5" value="0"></div>
          <output></output>
        </div>
        <div class="row">
          <label for="ry">y</label>
          <div class="slider"><input type="range" id="ry" min="-360" max="360" step="5" value="60"></div>
          <output></output>
        </div>
        <div class="row">
          <label for="rz">z</label>
          <div class="slider"><input type="range" id="rz" min="-360" max="360" step="5" value="0"></div>
          <output></output>
        </div>
        <div class="foot">
          <button class="btn" id="toggle"><span>pausar</span></button>
          <button class="btn" id="reset"><span>zerar</span></button>
        </div>
      </div>
    </div>
  </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.1/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.1/dist/Draggable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.1/dist/InertiaPlugin.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/animejs@4.5.0/dist/bundles/anime.umd.min.js"></script>


<script type="module">
  import liquidGL from "https://cdn.jsdelivr.net/npm/liquid-gl@3.0.0/liquidGL.js";


  gsap.registerPlugin(Draggable, InertiaPlugin);


  var animate = anime.animate;
  var stagger = anime.stagger;
  var createTimeline = anime.createTimeline;


  var $ = function (id) { return document.getElementById(id); };
  var stage = $('stage');
  var canvas = $('scene');
  var view = $('view');
  var panel = $('panel');
  var inner = $('inner');
  var handle = $('handle');
  var grip = $('grip');
  var collapse = $('collapse');
  var wrap = $('wrap');
  var toggle = $('toggle');
  var reset = $('reset');
  var axes = { x: $('rx'), y: $('ry'), z: $('rz') };
  var keys = ['x', 'y', 'z'];


  var angle = { x: 0, y: 0, z: 0 };
  var motion = { factor: 1 };
  var intro = { scale: 0.86, alpha: 0, tilt: -6, text: 0 };
  var running = !matchMedia('(prefers-reduced-motion: reduce)').matches;
  var resetAnim = null;
  var lens = null;
  var glass = { refraction: 0.02, bevelDepth: 0.1, magnify: 1, frost: 1.5 };


  if (!running) motion.factor = 0;


  var glOpts = { alpha: false, antialias: false, depth: false, stencil: false, powerPreference: 'high-performance' };
  var gl = canvas.getContext('webgl2', glOpts) || canvas.getContext('webgl', glOpts);
  var mirror = document.createElement('canvas');
  var mctx = mirror.getContext('2d', { alpha: false });
  var MIRROR_SCALE = 0.6;
  var rotBuf = new Float32Array(9);
  var isGL2 = typeof WebGL2RenderingContext !== 'undefined' && gl instanceof WebGL2RenderingContext;
  var dpr = 1;


  function shader(type, src) {
    var sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(sh));
    return sh;
  }


  function program(vs, fs) {
    var p = gl.createProgram();
    gl.attachShader(p, shader(gl.VERTEX_SHADER, vs));
    gl.attachShader(p, shader(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(p);
    return p;
  }


  var bgProg = program([
    'attribute vec2 a;',
    'void main() { gl_Position = vec4(a, 0.0, 1.0); }'
  ].join('\n'), [
    'precision highp float;',
    'uniform vec2 uRes;',
    'uniform float uTime;',
    'uniform float uDpr;',
    'uniform float uFade;',
    'uniform vec2 uTile;',
    'uniform sampler2D uText;',
    'void main() {',
    '  vec2 px = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y);',
    '  float row = floor(px.y / uTile.y);',
    '  float dir = mod(row, 2.0) < 1.0 ? 1.0 : -1.0;',
    '  float shift = row * uTile.x * 0.37 + dir * uTime * 14.0 * uDpr;',
    '  vec2 uv = vec2(fract((px.x + shift) / uTile.x), fract(px.y / uTile.y));',
    '  float a = texture2D(uText, uv).a * uFade;',
    '  vec3 col = mix(vec3(1.0), vec3(0.88), a);',
    '  gl_FragColor = vec4(col, 1.0);',
    '}'
  ].join('\n'));


  var fishProg = program([
    'attribute vec2 a;',
    'uniform vec2 uRes;',
    'uniform vec2 uSize;',
    'uniform mat3 uRot;',
    'uniform float uPersp;',
    'varying vec2 vUv;',
    'void main() {',
    '  vUv = a + 0.5;',
    '  vec3 p = uRot * vec3(a * uSize, 0.0);',
    '  float k = uPersp / (uPersp - p.z);',
    '  vec2 s = uRes * 0.5 + p.xy * k;',
    '  vec2 clip = s / uRes * 2.0 - 1.0;',
    '  clip.y = -clip.y;',
    '  gl_Position = vec4(clip / k, 0.0, 1.0 / k);',
    '}'
  ].join('\n'), [
    'precision highp float;',
    'uniform sampler2D uTex;',
    'uniform float uAlpha;',
    'varying vec2 vUv;',
    'void main() { gl_FragColor = texture2D(uTex, vUv) * uAlpha; }'
  ].join('\n'));


  var triBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, triBuf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);


  var quadBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-0.5, -0.5, 0.5, -0.5, -0.5, 0.5, 0.5, 0.5]), gl.STATIC_DRAW);


  var bgU = {
    res: gl.getUniformLocation(bgProg, 'uRes'),
    time: gl.getUniformLocation(bgProg, 'uTime'),
    dpr: gl.getUniformLocation(bgProg, 'uDpr'),
    fade: gl.getUniformLocation(bgProg, 'uFade'),
    tile: gl.getUniformLocation(bgProg, 'uTile'),
    text: gl.getUniformLocation(bgProg, 'uText'),
    a: gl.getAttribLocation(bgProg, 'a')
  };
  var fishU = {
    res: gl.getUniformLocation(fishProg, 'uRes'),
    size: gl.getUniformLocation(fishProg, 'uSize'),
    rot: gl.getUniformLocation(fishProg, 'uRot'),
    persp: gl.getUniformLocation(fishProg, 'uPersp'),
    alpha: gl.getUniformLocation(fishProg, 'uAlpha'),
    tex: gl.getUniformLocation(fishProg, 'uTex'),
    a: gl.getAttribLocation(fishProg, 'a')
  };


  var tex = null;
  var aspect = 1;
  var picture = new Image();
  picture.onload = function () {
    aspect = picture.naturalWidth / picture.naturalHeight;
    tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, picture);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    if (isGL2) {
      gl.generateMipmap(gl.TEXTURE_2D);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
    } else {
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    }
  };
  picture.src = 'pngtree-catfish-channel-fish-isolated-on-transparent-background-png-image_15814038.png';


  var textTex = gl.createTexture();
  var tile = { w: 1, h: 1, dpr: 0 };


  function buildText() {
    if (tile.dpr === dpr) return;
    tile.dpr = dpr;
    var size = 56 * dpr;
    var gap = 44 * dpr;
    var c = document.createElement('canvas');
    var ctx = c.getContext('2d');
    var font = '500 ' + size + 'px Geist, ui-sans-serif, system-ui, sans-serif';
    ctx.font = font;
    var step = ctx.measureText('').width + gap;
    var count = 6;
    c.width = Math.ceil(step * count);
    c.height = Math.round(size * 1.7);
    ctx.font = font;
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#000';
    for (var i = 0; i < count; i++) ctx.fillText(' ', i * step + gap / 2, c.height / 2);
    tile.w = c.width;
    tile.h = c.height;
    gl.bindTexture(gl.TEXTURE_2D, textTex);
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, c);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  }


  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    canvas.width = Math.round(window.innerWidth * dpr);
    canvas.height = Math.round(window.innerHeight * dpr);
    mirror.width = Math.round(window.innerWidth * MIRROR_SCALE);
    mirror.height = Math.round(window.innerHeight * MIRROR_SCALE);
    buildText();
  }


  function rotation(x, y, z) {
    var r = Math.PI / 180;
    var cx = Math.cos(x * r), sx = Math.sin(x * r);
    var cy = Math.cos(y * r), sy = Math.sin(y * r);
    var cz = Math.cos(z * r), sz = Math.sin(z * r);
    var Rx = [1, 0, 0, 0, cx, sx, 0, -sx, cx];
    var Ry = [cy, 0, -sy, 0, 1, 0, sy, 0, cy];
    var Rz = [cz, sz, 0, -sz, cz, 0, 0, 0, 1];
    return mul(mul(Rx, Ry), Rz);
  }


  function mul(a, b) {
    var o = new Array(9);
    for (var c = 0; c < 3; c++) {
      for (var rr = 0; rr < 3; rr++) {
        o[c * 3 + rr] = a[rr] * b[c * 3] + a[3 + rr] * b[c * 3 + 1] + a[6 + rr] * b[c * 3 + 2];
      }
    }
    return o;
  }


  function draw(time) {
    var w = canvas.width, h = canvas.height;
    gl.viewport(0, 0, w, h);


    gl.disable(gl.BLEND);
    gl.useProgram(bgProg);
    gl.bindBuffer(gl.ARRAY_BUFFER, triBuf);
    gl.enableVertexAttribArray(bgU.a);
    gl.vertexAttribPointer(bgU.a, 2, gl.FLOAT, false, 0, 0);
    gl.uniform2f(bgU.res, w, h);
    gl.uniform1f(bgU.time, time);
    gl.uniform1f(bgU.dpr, dpr);
    gl.uniform1f(bgU.fade, intro.text);
    gl.uniform2f(bgU.tile, tile.w, tile.h);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, textTex);
    gl.uniform1i(bgU.text, 0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);


    if (tex) drawFish(w, h);
    if (streaming) mctx.drawImage(canvas, 0, 0, mirror.width, mirror.height);
  }


  function drawFish(w, h) {
    var box = Math.min(Math.min(w, h) * 0.84, 920 * dpr) * intro.scale;
    var fw = aspect >= 1 ? box : box * aspect;
    var fh = aspect >= 1 ? box / aspect : box;


    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    gl.useProgram(fishProg);
    gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
    gl.enableVertexAttribArray(fishU.a);
    gl.vertexAttribPointer(fishU.a, 2, gl.FLOAT, false, 0, 0);
    gl.uniform2f(fishU.res, w, h);
    gl.uniform2f(fishU.size, fw, fh);
    rotBuf.set(rotation(angle.x, angle.y, angle.z + intro.tilt));
    gl.uniformMatrix3fv(fishU.rot, false, rotBuf);
    gl.uniform1f(fishU.persp, 1600 * dpr);
    gl.uniform1f(fishU.alpha, intro.alpha);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.uniform1i(fishU.tex, 0);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }


  resize();
  window.addEventListener('resize', resize);
  if (document.fonts && document.fonts.load) {
    document.fonts.load('500 56px Geist').then(function () { tile.dpr = 0; buildText(); });
  }


  var streaming = false;
  if (mirror.captureStream) {
    streaming = true;
    view.srcObject = mirror.captureStream(60);
    view.play().catch(function () {});
  } else {
    view.remove();
  }


  function paint(s) {
    var p = (Number(s.value) - Number(s.min)) / (Number(s.max) - Number(s.min)) * 100;
    s.style.setProperty('--a', Math.min(50, p) + '%');
    s.style.setProperty('--b', Math.max(50, p) + '%');
    var row = s.closest('.row');
    row.querySelector('output').textContent = Math.round(s.value) + '°/s';
    row.classList.toggle('on', Math.round(s.value) !== 0);
  }


  gsap.ticker.add(function (time, deltaTime) {
    var dt = Math.min(deltaTime, 100) / 1000 * motion.factor;
    if (dt > 0) {
      keys.forEach(function (k) {
        angle[k] = (angle[k] + axes[k].value * dt) % 360;
      });
    }
    draw(time);
    if (lens) {
      lens.options.refraction = glass.refraction;
      lens.options.bevelDepth = glass.bevelDepth;
      lens.options.magnify = glass.magnify;
      lens.options.frost = glass.frost;
    }
  });


  function swapText(btn, text) {
    var span = btn.querySelector('span');
    if (span.textContent === text) return;
    animate(span, {
      translateY: [0, -14],
      opacity: [1, 0],
      duration: 160,
      ease: 'inQuad',
      onComplete: function () {
        span.textContent = text;
        animate(span, {
          translateY: [14, 0],
          opacity: [0, 1],
          duration: 380,
          ease: 'outBack(1.6)'
        });
      }
    });
  }


  function press(btn) {
    animate(btn, {
      scale: [{ to: 0.94, duration: 90, ease: 'outQuad' }, { to: 1, duration: 500, ease: 'outElastic(1, .5)' }]
    });
  }


  function wobble(strength) {
    gsap.timeline()
      .to(glass, { magnify: 1 + 0.04 * strength, bevelDepth: 0.1 + 0.05 * strength, duration: 0.18, ease: 'power2.out' })
      .to(glass, { magnify: 1, bevelDepth: 0.1, duration: 1.1, ease: 'elastic.out(1, 0.4)' });
  }


  function setRunning(value) {
    running = value;
    swapText(toggle, running ? 'pausar' : 'girar');
    animate(motion, {
      factor: running ? 1 : 0,
      duration: 900,
      ease: running ? 'inOutSine' : 'outCubic'
    });
  }


  keys.forEach(function (k) {
    var s = axes[k];
    paint(s);
    s.addEventListener('input', function () {
      if (resetAnim) { resetAnim.pause(); resetAnim = null; motion.factor = running ? 1 : 0; }
      paint(s);
    });
    s.addEventListener('dblclick', function () {
      var v = { n: Number(s.value) };
      animate(v, {
        n: 0,
        duration: 700,
        ease: 'outElastic(1, .6)',
        onUpdate: function () { s.value = v.n; paint(s); }
      });
    });
  });


  toggle.addEventListener('click', function () { press(toggle); wobble(0.6); setRunning(!running); });
  stage.addEventListener('click', function () { setRunning(!running); });


  document.addEventListener('keydown', function (e) {
    if (e.code === 'Space' && e.target.tagName !== 'BUTTON') {
      e.preventDefault();
      setRunning(!running);
    }
  });


  function norm(a) { return ((a % 360) + 360) % 360; }
  function nearestZero(a) { return norm(a) > 180 ? 360 : 0; }


  reset.addEventListener('click', function () {
    press(reset);
    wobble(1);
    var v = {
      sx: Number(axes.x.value), sy: Number(axes.y.value), sz: Number(axes.z.value),
      ax: norm(angle.x), ay: norm(angle.y), az: norm(angle.z)
    };
    var before = running ? 1 : 0;
    motion.factor = 0;
    resetAnim = animate(v, {
      sx: 0, sy: 0, sz: 0,
      ax: nearestZero(v.ax), ay: nearestZero(v.ay), az: nearestZero(v.az),
      duration: 1300,
      ease: 'inOutQuart',
      onUpdate: function () {
        axes.x.value = v.sx; axes.y.value = v.sy; axes.z.value = v.sz;
        angle.x = v.ax; angle.y = v.ay; angle.z = v.az;
        keys.forEach(function (k) { paint(axes[k]); });
      },
      onComplete: function () {
        resetAnim = null;
        motion.factor = before;
      }
    });
  });


  var closed = false;
  var bars = collapse.querySelectorAll('span');


  collapse.addEventListener('click', function () {
    closed = !closed;
    collapse.setAttribute('aria-label', closed ? 'expandir' : 'recolher');
    animate(bars[1], {
      scaleX: closed ? 1 : 0,
      rotate: 90,
      duration: 500,
      ease: 'outBack(2)'
    });
    animate(bars[0], {
      rotate: closed ? [0, 180] : [180, 0],
      duration: 500,
      ease: 'outExpo'
    });
    wobble(0.7);


    if (closed) {
      animate('.row, .foot', {
        opacity: 0,
        translateY: -6,
        duration: 220,
        delay: stagger(25, { reversed: true }),
        ease: 'inQuad'
      });
      gsap.to(wrap, { height: 0, duration: 0.55, delay: 0.08, ease: 'power3.inOut' });
    } else {
      gsap.fromTo(wrap, { height: 0 }, { height: 'auto', duration: 0.6, ease: 'power3.out', onComplete: keepInside });
      animate('.row, .foot', {
        opacity: [0, 1],
        translateY: [10, 0],
        duration: 700,
        delay: stagger(50, { start: 120 }),
        ease: 'outExpo'
      });
    }
  });


  var proxy = document.createElement('div');
  proxy.setAttribute('data-liquid-ignore', '');
  proxy.style.cssText = 'position:fixed;left:0;top:0;width:1px;height:1px;visibility:hidden;pointer-events:none';
  document.body.appendChild(proxy);


  var followX = gsap.quickTo(panel, 'left', { duration: 0.55, ease: 'power3.out' });
  var followY = gsap.quickTo(panel, 'top', { duration: 0.55, ease: 'power3.out' });


  function bounds() {
    var r = panel.getBoundingClientRect();
    return {
      minX: 10, maxX: window.innerWidth - r.width - 10,
      minY: 10, maxY: window.innerHeight - r.height - 10
    };
  }


  function keepInside() {
    var r = panel.getBoundingClientRect();
    var b = bounds();
    followX(Math.min(Math.max(b.minX, r.left), b.maxX));
    followY(Math.min(Math.max(b.minY, r.top), b.maxY));
  }


  function follow() {
    followX(this.x);
    followY(this.y);
  }


  Draggable.create(proxy, {
    type: 'x,y',
    trigger: handle,
    dragClickables: false,
    inertia: true,
    edgeResistance: 0.8,
    throwResistance: 2200,
    bounds: bounds(),
    onPress: function () {
      var r = panel.getBoundingClientRect();
      gsap.set(proxy, { x: r.left, y: r.top });
      this.applyBounds(bounds());
      this.update();
      handle.classList.add('grabbing');
      gsap.to(glass, { magnify: 1.05, bevelDepth: 0.15, refraction: 0.03, duration: 0.35, ease: 'power3.out' });
      animate(grip.children, {
        scale: [{ to: 1.5, duration: 140 }, { to: 1, duration: 420 }],
        delay: stagger(22, { grid: [3, 2], from: 'center' }),
        ease: 'outQuad'
      });
    },
    onDrag: follow,
    onThrowUpdate: follow,
    onRelease: function () {
      handle.classList.remove('grabbing');
      gsap.to(glass, { magnify: 1, bevelDepth: 0.1, refraction: 0.02, duration: 1.4, ease: 'elastic.out(1, 0.35)' });
    }
  });


  inner.addEventListener('mouseenter', function () {
    gsap.to(glass, { frost: 0.6, duration: 0.6, ease: 'power2.out' });
  });
  inner.addEventListener('mouseleave', function () {
    gsap.to(glass, { frost: 1.5, duration: 0.8, ease: 'power2.out' });
  });


  window.addEventListener('resize', keepInside);


  gsap.set(panel, { left: 24, top: window.innerHeight - panel.offsetHeight - 24 });
  paint(axes.x); paint(axes.y); paint(axes.z);
  toggle.querySelector('span').textContent = running ? 'pausar' : 'girar';


  createTimeline()
    .add(intro, {
      text: [0, 1],
      duration: 1400,
      ease: 'outQuad'
    }, 0)
    .add(intro, {
      alpha: [0, 1],
      scale: [0.86, 1],
      tilt: [-6, 0],
      duration: 1800,
      ease: 'outExpo'
    }, 0)
    .add('.handle > *', {
      opacity: [0, 1],
      translateX: [-8, 0],
      duration: 700,
      delay: stagger(60),
      ease: 'outExpo'
    }, 350)
    .add('.row, .foot', {
      opacity: [0, 1],
      translateY: [12, 0],
      duration: 900,
      delay: stagger(70),
      ease: 'outExpo'
    }, 450);


  function startGlass() {
    try {
      lens = liquidGL({
        target: '.panel',
        snapshot: 'body',
        resolution: 1,
        refraction: 0.02,
        bevelDepth: 0.1,
        bevelWidth: 0.2,
        frost: 1.5,
        aberration: 0,
        tint: 'rgba(255, 255, 255, 0.28)',
        specular: true,
        shadow: true,
        reveal: 'fade',
        on: {
          init: function () {
            liquidGL.syncWith({ gsap: gsap });
            glass.refraction = 0.12;
            glass.magnify = 1.12;
            gsap.to(glass, { refraction: 0.02, magnify: 1, duration: 1.6, ease: 'elastic.out(1, 0.45)' });
          }
        }
      });
      if (Array.isArray(lens)) lens = lens[0];
    } catch (err) {
      console.warn('liquidGL não iniciou:', err);
    }
  }


  window.addEventListener('load', function () {
    if (view.isConnected && view.readyState < 2) {
      view.addEventListener('loadeddata', startGlass, { once: true });
    } else {
      startGlass();
    }
  });
</script>
</body>
</html>
